[package]
name = "downfall-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "downfall"
path = "src/main.rs"

[dependencies]
cairo-rs = "0.22.9"
fastrand = "2.5.0"
gio = "0.22"
gtk = { version = "0.11", package = "gtk4" }
gtk4-layer-shell = "0.8"
keyframe = "1.1.1"
pango = "0.22.9"
pangocairo = "0.22.9"
